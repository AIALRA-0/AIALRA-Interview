server {
    listen 80;
    listen [::]:80;
    server_name carreerdojo.aialra.online;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carreerdojo.aialra.online;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/carreerdojo.aialra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carreerdojo.aialra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /srv/aialra/config/nginx/snippets/aialra-hsts.conf;
    include /srv/aialra/config/nginx/snippets/aialra-auth-endpoints.conf;
    include /srv/aialra/config/nginx/snippets/aialra-auth-protect.conf;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cache-Control "private" always;

    location = /__origin_health {
        auth_request off;
        return 404;
    }

    location / {
        include /srv/aialra/config/nginx/snippets/aialra-auth-identity-headers.conf;

        # The browser's credentials and identity claims terminate here. The
        # loopback proxy constructs a new, allowlisted request for Sites.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Aialra-Proxy-Secret "";
        proxy_set_header Connection "";

        proxy_pass http://127.0.0.1:13110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header WWW-Authenticate;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
